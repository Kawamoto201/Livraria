{% extends "base.html" %}

{% block conteudo %}
<main>
    <h1>Cadastro de Livro</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <p style="color: green; font-weight: bold;">
            {{ msg }}
          </p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">

        <div>
            <label for="titulo">Título do Livro:</label>
            <input 
                type="text" 
                name="titulo_livro" 
                id="titulo" 
                required>
        </div>

        <div>
            <label for="autor">Autor:</label>
            <input 
                type="text" 
                name="autor_livro" 
                id="autor" 
                required>
        </div>

        <div>
            <label for="valor">Preço:</label>
            <input 
                type="number" 
                name="valor_livro" 
                id="valor" 
                step="0.01" 
                min="0" 
                required>
        </div>

        <div>
            <label for="quantidade">Quantidade:</label>
            <input 
                type="number" 
                name="qtd_livro" 
                id="quantidade" 
                min="0"
                required>
        </div>

        <br>

        <div>
            <button type="submit">Cadastrar Livro</button>
        </div>

    </form>
</main>

<hr>

{% endblock %}
